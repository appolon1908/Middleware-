components:
  schemas:
    CommandEnvelope:
      properties:
        command_id:
          type: string
          format: uuid
          title: Command Id
        command_type:
          type: string
          maxLength: 180
          pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)+$
          title: Command Type
        command_version:
          type: string
          const: '1.0'
          title: Command Version
        target:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Target
        tenant_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Tenant Id
        requested_by:
          type: string
          maxLength: 300
          minLength: 1
          title: Requested By
        correlation_id:
          type: string
          maxLength: 180
          minLength: 1
          title: Correlation Id
        idempotency_key:
          type: string
          maxLength: 180
          minLength: 8
          title: Idempotency Key
        capability:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,100}$
          title: Capability
        payload:
          type: object
          title: Payload
      additionalProperties: false
      type: object
      required:
      - command_id
      - command_type
      - command_version
      - target
      - tenant_id
      - requested_by
      - correlation_id
      - idempotency_key
      - capability
      - payload
      title: CommandEnvelope
    CommunicationEventPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/MessageEvent'
          type: array
          title: Items
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
      type: object
      required:
      - items
      title: CommunicationEventPage
    CommunicationMessage:
      properties:
        messageId:
          type: string
          format: uuid
          title: Messageid
        tenantId:
          type: string
          title: Tenantid
        channel:
          type: string
          enum:
          - email
          - sms
          - voice
          title: Channel
        direction:
          type: string
          enum:
          - outbound
          - inbound
          title: Direction
        status:
          type: string
          enum:
          - accepted
          - queued
          - dispatched
          - delivered
          - failed
          - cancelled
          - suppressed
          - expired
          - indeterminate
          title: Status
        correlationId:
          type: string
          title: Correlationid
        idempotencyKey:
          type: string
          title: Idempotencykey
        operationId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Operationid
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        providerReference:
          anyOf:
          - type: string
          - type: 'null'
          title: Providerreference
        failureCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Failurecode
        failureMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Failuremessage
        createdAt:
          type: string
          format: date-time
          title: Createdat
        acceptedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Acceptedat
        dispatchedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Dispatchedat
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completedat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
        metadata:
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
      - messageId
      - tenantId
      - channel
      - direction
      - status
      - correlationId
      - idempotencyKey
      - createdAt
      - updatedAt
      title: CommunicationMessage
    CommunicationMessagePage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CommunicationMessage'
