openapi: 3.1.0
info:
  title: Codestra Middleware API
  version: 0.1.0
  description: Exact generated Middleware runtime contract. Bearer tokens use issuer
    https://auth.codestra.co/realms/codestra and audience middleware-api. Tenant-scoped
    reads enforce each configured caller status_scope; mutations enforce command_scope.
    External effects remain disabled.
paths:
  /v1/integrations/n8n/commands:
    post:
      tags:
      - n8n-control-plane
      summary: Submit N8N Command
      description: 'Accept a durable command through the legacy n8n v1 compatibility
        route.


        Kong remains the network/API gateway. Middleware independently validates the

        original Keycloak token so a gateway routing mistake cannot grant write

        authority. The canonical successor is the lease-bound v2 automation API.'
      operationId: submit_n8n_command_v1_integrations_n8n_commands_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandEnvelope'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid canonical request
          content:
            application/json:
              schema: &id002
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - correlation_id
                    - retryable
                    - details
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      correlation_id:
                        type: string
                      retryable:
                        type: boolean
                      details:
                        type: object
        '401':
          description: Authentication failed
        '403':
          description: Scope or tenant denied
        '404':
          description: Resource not found
        '409':
          description: Version, state, or idempotency conflict
        '429':
          description: Rate limited
        '503':
          description: Required durable dependency unavailable
      deprecated: true
      security:
      - bearerAuth: []
      parameters:
      - &id001
        name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - &id003
        name: X-Correlation-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 180
      - &id004
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 180
  /v1/integrations/n8n/operations/{command_id}:
    get:
      tags:
      - n8n-control-plane
      summary: Get N8N Operation
      description: Return durable command state through the legacy n8n v1 compatibility
