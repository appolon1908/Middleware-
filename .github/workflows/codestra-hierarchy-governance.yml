name: Codestra Hierarchy Governance
on:
  pull_request:
    branches:
      - main
      - development
      - testing
      - staging
      - production
      - 'section/**'
      - 'subsection/**'
permissions:
  contents: read
  pull-requests: read
  statuses: read
jobs:
  promotion-guard:
    name: promotion-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce promotion path
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 governance/promotion_guard.py

  development-ci-admission:
    name: development-ci-admission
    needs: promotion-guard
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Require exact-SHA CI before Development Department admission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          state=""
          for _ in {1..120}; do
            state="$(
              curl --fail --silent --show-error \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/commits/${HEAD_SHA}/statuses?per_page=100" \
              | jq -r '[.[] | select(.context == "codestra/required-ci")][0].state // ""'
            )"
            case "${state}" in
              success)
                echo "DEVELOPMENT_CI_ADMISSION=PASS head_sha=${HEAD_SHA}"
                exit 0
                ;;
              failure|error)
                echo "DEVELOPMENT_CI_ADMISSION=BLOCK required_ci=${state} head_sha=${HEAD_SHA}" >&2
                exit 1
                ;;
              pending|"")
                sleep 15
                ;;
              *)
                echo "unexpected required-ci state: ${state}" >&2
                exit 1
                ;;
            esac
          done
          echo "DEVELOPMENT_CI_ADMISSION=BLOCK required_ci_timeout head_sha=${HEAD_SHA}" >&2
          exit 1

  control-plane-certification:
    name: control-plane-certification
    needs:
      - promotion-guard
      - development-ci-admission
    runs-on: [self-hosted, linux, x64, codestra-control-plane]
    timeout-minutes: 10
    steps:
      - name: Verify exact SHA in Codestra Development Department control plane
        run: |
          /srv/codestra/dev-platform/control-plane/bin/codestra-github-check \
            --product 'Middleware-' \
            --repo-path '/srv/codestra/apps/Middleware-' \
            --head-ref '${{ github.head_ref }}' \
            --base-ref '${{ github.base_ref }}' \
            --head-sha '${{ github.event.pull_request.head.sha }}'

  promotion-gate:
    name: promotion-gate
    if: ${{ always() }}
    needs:
      - promotion-guard
      - development-ci-admission
      - control-plane-certification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Certify Development Department promotion gate
        shell: bash
        env:
          GUARD_RESULT: ${{ needs.promotion-guard.result }}
          CI_ADMISSION_RESULT: ${{ needs.development-ci-admission.result }}
          CONTROL_PLANE_RESULT: ${{ needs.control-plane-certification.result }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "${GUARD_RESULT}" = "success"
          test "${CI_ADMISSION_RESULT}" = "success"
          test "${CONTROL_PLANE_RESULT}" = "success"
          echo "DEVELOPMENT_DEPARTMENT=PASS"
          echo "PROMOTION_GATE=PASS head=${HEAD_REF} base=${BASE_REF} sha=${HEAD_SHA}"
