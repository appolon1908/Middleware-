name: Codestra Hierarchy Governance
on:
  pull_request:
    branches:
      - main
      - development
      - testing
      - staging
      - production
      - 'section/**'
      - 'subsection/**'
permissions:
  contents: read
  pull-requests: read
  statuses: read
jobs:
  promotion-guard:
    name: promotion-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce promotion path
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 governance/promotion_guard.py

  control-plane-certification:
    name: control-plane-certification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require external Codestra control-plane certification
        shell: bash
        run: |
          set -euo pipefail
          state="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${EXACT_SHA}/status"               --jq '[.statuses[] | select(.context=="codestra-control-plane")][0].state // ""'
          )"
          test "$state" = "success"
          echo "CONTROL_PLANE_CERTIFICATION=PASS exact_sha=${EXACT_SHA}"
