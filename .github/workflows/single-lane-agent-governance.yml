name: Single-lane agent governance

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  governance:
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04, middleware-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate single-lane authority
        shell: bash
        env:
          CODESTRA_CI_REMOTE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CODESTRA_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          chmod +x scripts/agent_preflight.sh
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          ./scripts/agent_preflight.sh --ci --branch "$branch"
