name: Apply integration protected-main authorities

on:
  pull_request:
    paths:
      - ".github/workflows/integration-main-release-authorities.yml"
      - "config/integration-main-release-authorities.v1.json"
      - "scripts/apply_integration_main_release_authorities.py"
      - "tests/test_integration_main_release_authorities.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/integration-main-release-authorities.yml"
      - "config/integration-main-release-authorities.v1.json"
      - "scripts/apply_integration_main_release_authorities.py"
      - "tests/test_integration_main_release_authorities.py"
  workflow_dispatch:
    inputs:
      mode:
        description: Validate, apply, or verify the fixed integration authorities
        required: true
        type: choice
        options: [validate, apply, verify]
        default: validate
      confirmation:
        description: For apply, type APPLY_INTEGRATION_MAIN_RELEASE_AUTHORITY_V1
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: integration-main-release-authorities-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  policy:
    name: integration-main-release-authority-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Validate fixed repository, reviewer, and ruleset authority
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/apply_integration_main_release_authorities.py \
            tests/test_integration_main_release_authorities.py
          python3 -m unittest -v tests.test_integration_main_release_authorities
          python3 scripts/apply_integration_main_release_authorities.py --mode validate
          python3 -m json.tool config/integration-main-release-authorities.v1.json >/dev/null
          git diff --check
      - name: Upload secret-free policy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-main-release-authority-policy-${{ env.EXPECTED_SHA }}
          path: artifacts/integration-main-release-authorities/
          if-no-files-found: error
          retention-days: 30

  apply:
    name: apply-and-verify-integration-main-authorities
    needs: [policy]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      (inputs.mode == 'apply' || inputs.mode == 'verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: repository-administration
    steps:
      - name: Check out exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require exact protected source and confirmation
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$REQUESTED_MODE" = apply ]; then
            test "$CONFIRMATION" = APPLY_INTEGRATION_MAIN_RELEASE_AUTHORITY_V1
          fi
      - id: rollout
        name: Apply or verify fixed integration authorities
        continue-on-error: true
        env:
          CODESTRA_REPOSITORY_ADMIN_TOKEN: ${{ secrets.CODESTRA_REPOSITORY_ADMIN_TOKEN }}
          REQUESTED_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test -n "$CODESTRA_REPOSITORY_ADMIN_TOKEN"
          args=(--mode "$REQUESTED_MODE")
          if [ "$REQUESTED_MODE" = apply ]; then
            args+=(--confirm "$CONFIRMATION")
          fi
          python3 scripts/apply_integration_main_release_authorities.py "${args[@]}"
      - name: Upload bounded rollout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-main-release-authority-rollout-${{ github.sha }}
          path: artifacts/integration-main-release-authorities/
          if-no-files-found: error
          retention-days: 90
      - name: Fail closed on invitation or readback failure
        if: ${{ steps.rollout.outcome != 'success' }}
        run: |
          echo 'INTEGRATION_MAIN_RELEASE_AUTHORITY=BLOCKED' >&2
          echo 'Pending reviewer invitations must be accepted before verification can pass.' >&2
          exit 1
      - name: Confirm no runtime effect
        if: always()
        run: |
          echo 'RUNTIME_CONTACTED=NO'
          echo 'PRODUCTION_CHANGED=NO'
          echo 'EXTERNAL_EFFECTS_ENABLED=NO'
